<style>
:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0}
img{max-width:100%}
[hidden]{display:none!important}

<title>Máy quét tài liệu</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: phone-first column (stage, page strip, controls); two columns from 860px.
   Palette: cool paper-grey surfaces, ink-blue accent, active filter drawn as solid ink. */
:root{
  --bg:#EDF0F4; --surface:#FFFFFF; --ink:#14202B; --muted:#586878; --line:#D3DAE2;
  --accent:#2B4BE0; --accent-ink:#FFFFFF; --stage:#D8DEE5; --danger:#B42318; --soft:#E4E9FF;
  --font:'Be Vietnam Pro',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0E141B; --surface:#16202A; --ink:#E6ECF2; --muted:#92A1B0; --line:#2A3743;
    --accent:#8EA2FF; --accent-ink:#0B1120; --stage:#0A0F15; --danger:#FF8A80; --soft:#222E52;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0E141B; --surface:#16202A; --ink:#E6ECF2; --muted:#92A1B0; --line:#2A3743;
  --accent:#8EA2FF; --accent-ink:#0B1120; --stage:#0A0F15; --danger:#FF8A80; --soft:#222E52;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 15px/1.45 var(--font);-webkit-text-size-adjust:100%}
.app{
  max-width:1040px;margin:0 auto;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:16px 28px;
  display:flex;flex-direction:column;gap:14px;
}
.top{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
h1{margin:0;font-size:21px;font-weight:700;letter-spacing:-.01em;text-wrap:balance}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
#count{color:var(--muted);font-size:13px}
.grid{display:grid;gap:14px;grid-template-columns:minmax(0,1fr)}
@media (min-width:860px){
  .grid{grid-template-columns:minmax(0,1.3fr) minmax(300px,.7fr);align-items:start}
  .stage{height:min(74vh,760px)!important}
}
.stagecol{display:flex;flex-direction:column;gap:10px;min-width:0}
.stage{
  position:relative;height:min(60vh,540px);background:var(--stage);border-radius:12px;
  display:grid;place-items:center;overflow:hidden;
}
.frame{position:relative;box-shadow:0 1px 2px rgba(0,0,0,.25),0 8px 24px rgba(0,0,0,.18);background:#fff;-webkit-user-select:none;user-select:none}
.frame canvas{display:block;width:100%;height:100%}
.frame.cropping{touch-action:none}
.crop{position:absolute;inset:0}
.box{
  position:absolute;border:1px solid rgba(255,255,255,.95);box-shadow:0 0 0 100vmax rgba(8,12,18,.55);cursor:move;touch-action:none;
  background-image:
    linear-gradient(to right,transparent 33.2%,rgba(255,255,255,.35) 33.3%,transparent 33.5%,transparent 66.5%,rgba(255,255,255,.35) 66.6%,transparent 66.8%),
    linear-gradient(to bottom,transparent 33.2%,rgba(255,255,255,.35) 33.3%,transparent 33.5%,transparent 66.5%,rgba(255,255,255,.35) 66.6%,transparent 66.8%);
}
.h{position:absolute;width:44px;height:44px;touch-action:none}
.h::before{content:"";position:absolute;border:0 solid #fff;filter:drop-shadow(0 0 2px rgba(0,0,0,.7))}
.h.tl{left:0;top:0}.h.tl::before{left:2px;top:2px;width:22px;height:22px;border-width:4px 0 0 4px}
.h.tr{right:0;top:0}.h.tr::before{right:2px;top:2px;width:22px;height:22px;border-width:4px 4px 0 0}
.h.bl{left:0;bottom:0}.h.bl::before{left:2px;bottom:2px;width:22px;height:22px;border-width:0 0 4px 4px}
.h.br{right:0;bottom:0}.h.br::before{right:2px;bottom:2px;width:22px;height:22px;border-width:0 4px 4px 0}
.h.t{left:50%;top:0;transform:translateX(-50%)}.h.t::before{left:8px;right:8px;top:2px;border-width:4px 0 0}
.h.b{left:50%;bottom:0;transform:translateX(-50%)}.h.b::before{left:8px;right:8px;bottom:2px;border-width:0 0 4px}
.h.l{left:0;top:50%;transform:translateY(-50%)}.h.l::before{top:8px;bottom:8px;left:2px;border-width:0 0 0 4px}
.h.r{right:0;top:50%;transform:translateY(-50%)}.h.r::before{top:8px;bottom:8px;right:2px;border-width:0 4px 0 0}
.empty{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center;padding:20px}
.empty h2{margin:0;font-size:18px;font-weight:600}
.empty p{margin:0;color:var(--muted);max-width:30ch}
.empty .row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-top:6px}
.busy{position:absolute;inset:0;background:rgba(10,15,21,.62);color:#fff;display:flex;align-items:center;justify-content:center;font-family:var(--mono);font-size:14px;text-align:center;padding:20px}
.meta{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px 12px}
.dims{font-size:12.5px;color:var(--muted);min-width:0}
.chip{display:inline-block;font-family:var(--mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;background:var(--soft);color:var(--ink);padding:2px 7px;border-radius:5px;margin-right:6px}
.metaact{display:flex;gap:8px}
.strip{position:relative;display:flex;gap:8px;overflow-x:auto;padding:3px 3px 8px;scrollbar-width:thin}
.thumb,.addtile{flex:none;width:64px;height:86px;padding:0;border-radius:8px;position:relative;overflow:hidden;font:inherit;color:inherit;cursor:pointer}
.thumb{border:2px solid var(--line);background:var(--stage)}
.thumb canvas{display:block;width:100%;height:100%;object-fit:contain}
.thumb span{position:absolute;left:3px;bottom:3px;font-family:var(--mono);font-size:11px;line-height:16px;min-width:16px;text-align:center;padding:0 4px;border-radius:4px;background:var(--ink);color:var(--bg)}
.thumb.on{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent)}
.addtile{border:2px dashed var(--line);background:transparent;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:11.5px;color:var(--muted)}
.addtile svg{width:20px;height:20px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:16px;min-width:0}
.sec{display:flex;flex-direction:column;gap:8px}
.lbl{display:flex;justify-content:space-between;align-items:center;font-size:11.5px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
svg.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex:none}
button{font:inherit;color:inherit}
.btn{min-height:44px;padding:0 14px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink);display:inline-flex;align-items:center;justify-content:center;gap:8px;font-weight:500;cursor:pointer;touch-action:manipulation}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.btn.sm{min-height:38px;padding:0 12px;font-size:14px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn:active:not(:disabled){transform:translateY(1px)}
.seg{display:grid;gap:6px}
.seg.c4{grid-template-columns:repeat(4,1fr)}
.seg.c2{grid-template-columns:repeat(2,1fr)}
.seg button{min-height:44px;padding:0 4px;border-radius:9px;border:1px solid var(--line);background:var(--surface);font-weight:500;font-size:14px;cursor:pointer;touch-action:manipulation}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.seg button:disabled{opacity:.45;cursor:not-allowed}
.sl{display:grid;gap:2px}
.sl .row{display:flex;justify-content:space-between;font-size:14px}
.sl .row output{font-family:var(--mono);color:var(--muted);font-size:13px}
input[type=range]{width:100%;height:36px;margin:0;accent-color:var(--accent)}
.linkbtn{background:none;border:0;padding:6px 0;color:var(--accent);font-size:13px;font-weight:500;cursor:pointer;text-transform:none;letter-spacing:0}
.tools{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.tool{min-height:58px;border-radius:9px;border:1px solid var(--line);background:var(--surface);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11.5px;cursor:pointer;padding:4px 0;touch-action:manipulation}
.tool:disabled{opacity:.4;cursor:not-allowed}
.tool.danger{color:var(--danger)}
.note{font-size:13px;color:var(--muted);min-height:1.4em}
.hint{font-size:13px;color:var(--muted)}
.two{display:grid;grid-template-columns:repeat(2,1fr);gap:6px}
.two .btn{padding:0 8px;font-size:14px;text-align:center}
.chk{display:flex;align-items:center;gap:10px;min-height:40px;font-size:14px;cursor:pointer}
.chk input{width:20px;height:20px;margin:0;accent-color:var(--accent);flex:none}
.exp{display:flex;flex-direction:column;gap:8px}
.exp .btn.primary{justify-content:space-between}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
#toast{
  position:fixed;left:max(16px,env(safe-area-inset-left,0px));right:max(16px,env(safe-area-inset-right,0px));
  bottom:calc(16px + env(safe-area-inset-bottom,0px));margin:0 auto;max-width:460px;
  background:var(--ink);color:var(--bg);border-radius:10px;padding:10px 14px;display:flex;align-items:center;justify-content:space-between;gap:12px;
  font-size:14px;opacity:0;transform:translateY(8px);pointer-events:none;transition:opacity .18s,transform .18s;z-index:20;
}
#toast.on{opacity:1;transform:none;pointer-events:auto}
#toast button{background:none;border:0;color:var(--bg);font-weight:700;text-decoration:underline;padding:4px;cursor:pointer}
@media (prefers-reduced-motion:reduce){#toast{transition:none}.btn:active:not(:disabled){transform:none}}
</style>

</head>
<body>
<div class="app">
  <header class="top">
    <h1>Máy quét tài liệu</h1>
    <span class="mono" id="count">0 / 0</span>
  </header>

  <main class="grid">
    <section class="stagecol" aria-label="Xem trước">
      <div class="stage" id="stage">
        <div class="frame" id="frame" hidden>
          <canvas id="cv" aria-label="Bản xem trước trang đang chọn"></canvas>
          <div class="crop" id="crop" hidden>
            <div class="box" id="box" data-h="move">
              <i class="h t" data-h="t"></i><i class="h b" data-h="b"></i><i class="h l" data-h="l"></i><i class="h r" data-h="r"></i>
              <i class="h tl" data-h="tl"></i><i class="h tr" data-h="tr"></i><i class="h bl" data-h="bl"></i><i class="h br" data-h="br"></i>
            </div>
          </div>
        </div>
        <div class="empty" id="empty" hidden>
          <h2>Chưa có trang nào</h2>
          <p>Chụp tài liệu hoặc chọn ảnh có sẵn trong máy.</p>
          <div class="row">
            <button class="btn primary" data-add="cam"><svg class="i" viewBox="0 0 24 24"><path d="M14.5 4h-5L7 7H4a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-3l-2.5-3z"/><circle cx="12" cy="13" r="3"/></svg>Chụp ảnh</button>
            <button class="btn" data-add="pick"><svg class="i" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="9" cy="9" r="2"/><path d="m21 15-3.1-3.1a2 2 0 0 0-2.8 0L6 21"/></svg>Chọn ảnh</button>
          </div>
        </div>
        <div class="busy" id="busy" hidden></div>
      </div>

      <div class="meta">
        <div class="dims" id="dims"></div>
        <div class="metaact" id="metaAct">
          <button class="btn sm" id="compare" data-p data-keep-hold><svg class="i" viewBox="0 0 24 24"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>Giữ để xem ảnh gốc</button>
        </div>
        <div class="metaact" id="cropAct" hidden>
          <button class="btn sm" id="cropReset">Đặt lại</button>
          <button class="btn sm" id="cropCancel">Hủy</button>
          <button class="btn sm primary" id="cropDone">Xong</button>
        </div>
      </div>

      <div class="strip" id="strip" aria-label="Các trang"></div>
    </section>

    <section class="panel" aria-label="Chỉnh sửa và xuất file">
      <div class="sec">
        <div class="lbl">Bộ lọc</div>
        <div class="seg c4" id="filters">
          <button data-f="orig" data-p>Gốc</button>
          <button data-f="doc" data-p>Tài liệu</button>
          <button data-f="bw" data-p>Trắng đen</button>
          <button data-f="gray" data-p>Xám</button>
        </div>
      </div>

      <div class="sec">
        <div class="lbl"><span>Điều chỉnh</span><button class="linkbtn" id="resetAdj" data-p>Đặt lại</button></div>
        <div class="sl"><div class="row"><label for="bright">Độ sáng</label><output id="vBright" class="mono">0</output></div>
          <input type="range" id="bright" min="-50" max="50" step="1" value="0" data-p></div>
        <div class="sl"><div class="row"><label for="contrast">Tương phản</label><output id="vContrast" class="mono">0</output></div>
          <input type="range" id="contrast" min="-40" max="80" step="1" value="0" data-p></div>
      </div>

      <div class="sec">
        <div class="lbl"><span>Tự chỉnh thẳng</span><button class="linkbtn" id="restoreBtn" data-p>Khôi phục ảnh gốc</button></div>
        <div class="two">
          <button class="btn primary" id="fixBtn" data-p>Trang này</button>
          <button class="btn" id="fixAllBtn" data-p>Tất cả trang</button>
        </div>
        <label class="chk"><input type="checkbox" id="autoAdd" checked>Tự chỉnh khi thêm ảnh</label>
        <div class="hint">Tìm cạnh giấy, nắn phẳng phối cảnh và xoay cho chữ nằm ngang.</div>
      </div>

      <div class="sec">
        <div class="lbl">Chỉnh trang</div>
        <div class="tools">
          <button class="tool" id="rotL" data-p><svg class="i" viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></svg>Xoay trái</button>
          <button class="tool" id="rotR" data-p><svg class="i" viewBox="0 0 24 24"><path d="M21 12a9 9 0 1 1-9-9c2.52 0 4.93 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/></svg>Xoay phải</button>
          <button class="tool" id="cropBtn" data-p><svg class="i" viewBox="0 0 24 24"><path d="M6 2v14a2 2 0 0 0 2 2h14"/><path d="M18 22V8a2 2 0 0 0-2-2H2"/></svg>Cắt</button>
          <button class="tool" id="mvL" data-p><svg class="i" viewBox="0 0 24 24"><path d="M19 12H5"/><path d="m12 19-7-7 7-7"/></svg>Dời trái</button>
          <button class="tool" id="mvR" data-p><svg class="i" viewBox="0 0 24 24"><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></svg>Dời phải</button>
          <button class="tool danger" id="delBtn" data-p><svg class="i" viewBox="0 0 24 24"><path d="M3 6h18"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>Xóa</button>
        </div>
      </div>

      <div class="sec exp">
        <div class="lbl">Xuất file</div>
        <div class="seg c2" id="sizes" role="group" aria-label="Khổ giấy PDF">
          <button data-s="a4" aria-pressed="true">Khổ A4</button>
          <button data-s="fit" aria-pressed="false">Theo ảnh</button>
        </div>
        <div class="hint">Mọi trang trong danh sách được gộp thành một file PDF, theo thứ tự ảnh thu nhỏ.</div>

const cmp = $('compare');
const holdOn = () => { if (showOrig || !cur()) return; showOrig = true; schedule(); };
const holdOff = () => { if (!showOrig) return; showOrig = false; schedule(); };
cmp.addEventListener('pointerdown', e => { e.preventDefault(); holdOn(); });
['pointerup', 'pointerleave', 'pointercancel', 'blur'].forEach(ev => cmp.addEventListener(ev, holdOff));
cmp.addEventListener('keydown', e => { if (e.key === ' ' || e.key === 'Enter') { e.preventDefault(); holdOn(); } });
cmp.addEventListener('keyup', e => { if (e.key === ' ' || e.key === 'Enter') holdOff(); });
cmp.addEventListener('contextmenu', e => e.preventDefault());

let rz = 0;
window.addEventListener('resize', () => { clearTimeout(rz); rz = setTimeout(() => { if (cv.width) fitFrame(cv.width, cv.height); }, 120); });


(async () => {
  const s = await ingest(makeSample(), { sample: true, crop: { x: 0.14, y: 0.105, w: 0.72, h: 0.79 } });
  try { await straighten(s); } catch (e) {}
  pages.push(s); state.cur = 0;
  syncAll();
})();
setControls();
})();
</script>
